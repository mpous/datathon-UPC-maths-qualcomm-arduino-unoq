<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cangur Coach: review the hints</title>
  <style>
    :root { --ink:#1d2433; --muted:#5c667a; --line:#dfe3ea; --bg:#f5f7fa; --card:#fff; --ok:#1b7f3b; --bad:#b3261e; --accent:#1f5fbf; --warm:#8a5a00; --warm-bg:#fff6e0; }
    * { box-sizing:border-box; } body { margin:0; font:15px/1.5 system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:18px 20px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:1; }
    .inner { max-width:1000px; margin:auto; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    h1 { font-size:18px; margin:0; } main { max-width:1000px; margin:auto; padding:20px; display:grid; gap:14px; }
    select, button { font:inherit; } select { padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
    .pill { font-size:13px; padding:3px 10px; border-radius:999px; background:var(--bg); border:1px solid var(--line); color:var(--muted); }
    .count { margin-left:auto; font-weight:600; }
    article { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; }
    article.rejected { opacity:.6; } .meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .text { white-space:pre-wrap; overflow-wrap:anywhere; } .options { color:var(--muted); font-size:14px; margin:8px 0; overflow-wrap:anywhere; }
    .options b.right { color:var(--ok); }
    .hint { border-left:4px solid #e8c877; background:var(--warm-bg); padding:10px 12px; border-radius:0 8px 8px 0; margin:10px 0; overflow-wrap:anywhere; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    button { padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); }
    button.keep.on { background:#e6f4ea; border-color:var(--ok); color:var(--ok); font-weight:600; }
    button.reject.on { background:#fce8e6; border-color:var(--bad); color:var(--bad); font-weight:600; }
    .reason { font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <header><div class="inner">
    <h1>🦘 Review the model's hints</h1>
    <select id="lang"><option value="">All languages</option><option value="cat">Català</option><option value="eng">English</option></select>
    <select id="show"><option value="passed">Passed the code checks</option><option value="all">All</option><option value="rejected">Rejected</option></select>
    <a href="/" class="pill">Back to the coach</a>
    <span class="count" id="count"></span>
  </div></header>
  <main id="list"></main>
  <script>
    const esc = v => String(v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    let hints = [];
    function render() {
      const lang = document.getElementById("lang").value, show = document.getElementById("show").value;
      const rows = hints.filter(h => (!lang || h.language === lang) && (show === "all" || (show === "passed") === h.ok));
      document.getElementById("count").textContent = `${hints.filter(h => h.ok).length} kept of ${hints.length}`;
      document.getElementById("list").innerHTML = rows.map(h => `
        <article class="${h.ok ? "" : "rejected"}" data-id="${esc(h.id)}" data-lang="${esc(h.language)}">
          <div class="meta"><span class="pill">${esc(h.id)}</span><span class="pill">${esc(h.language)}</span><span class="pill">level ${h.level}</span></div>
          <div class="text">${esc(h.text)}</div>
          <div class="options">${"ABCDE".split("").map(l => `<b class="${l === h.label ? "right" : ""}">${l})</b> ${esc(h.options[l])}${l === h.label ? " ✓" : ""}`).join(" &nbsp; ")}</div>
          <div class="hint">${esc(h.hint)}</div>
          <div class="row"><button class="keep ${h.ok ? "on" : ""}">Keep</button><button class="reject ${h.ok ? "" : "on"}">Reject</button>
            <span class="reason">${esc(h.reason || "passed the code checks")}</span></div>
        </article>`).join("") || "<p>No hints here yet. Run coach/make_hints.py on the board.</p>";
    }
    document.getElementById("list").addEventListener("click", async e => {
      const button = e.target.closest("button"); if (!button) return;
      const card = button.closest("article"), keep = button.classList.contains("keep");
      const hint = hints.find(h => h.id === card.dataset.id && h.language === card.dataset.lang);
      await fetch("/api/review", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id: hint.id, language: hint.language, keep})});
      hint.ok = keep; hint.reason = keep ? "human: kept" : "human: rejected"; render();
    });
    ["lang", "show"].forEach(id => document.getElementById(id).addEventListener("change", render));
    fetch("/api/hints").then(r => r.json()).then(rows => { hints = rows; render(); });
  </script>
</body>
</html>
